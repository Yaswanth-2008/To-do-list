<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do-list</title>
    <script src="https://kit.fontawesome.com/0ad8a4842d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container gentle_bdr_radius">
        <div class="flex_fit">
            <h1 class="Header">To-do-<span class="accent_txt">LIST</span></h1>
        </div><br>
        <div class="gentle_bdr_radius input-container sub_container">
            <input type="text" id="Add_task" class="Add_task no_brdr">
            <button onclick="AddClicked()" class="TODO_btn btn no_brdr" id="TODO_btn">ADD</button>
        </div>
        <div class="gentle_bdr_radius tasks-container sub_container">
            <div class='task'>
                    <ul class='gentle_bdr_radius task_ul' id='task_ul' id="List_data">
                        <li class="task_li" onclick="Task_Done(this)">Add You Tasks <span class="trash_can clickable" onclick="DeleteClicked(this)" ><i class="fa-solid fa-trash"></i></span></li>
                    </ul>

            </div>
        </div>
    </div>
    <script src="todo.js"></script>
</body>
</html>
